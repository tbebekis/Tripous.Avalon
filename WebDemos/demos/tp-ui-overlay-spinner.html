<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tp.ScreenOverlay / tp.Spinner</title>
    <link rel="stylesheet" href="../tripous/css/tp-Variables.css">
    <link rel="stylesheet" href="../tripous/css/tp.css">
    <link rel="stylesheet" href="../tripous/css/font-awesome.css">
    <link rel="stylesheet" href="../tripous/css/glyphicons.css">
    <link rel="stylesheet" href="../tripous/css/tp-UI.css">
    <link rel="stylesheet" href="../assets/css/demos.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.2/ace.js"></script>
    <script src="../tripous/js/tp.js"></script>
    <script src="../tripous/js/tp-Data.js"></script>
    <script src="../tripous/js/tp-UI.js"></script>
    <script src="../assets/js/demos.js"></script>
</head>
<body class="demo-page">
    <script>
        if (window.top !== window.self) {
            document.body.classList.add("is-embedded");
        }
        Demos.RegisterSourcePreview();
    </script>

    <main class="demo-body">
        <p class="demo-index-link">
            <a href="../index.html">Tripous Web Demos</a>
        </p>
        <h1>tp.ScreenOverlay / tp.Spinner</h1>
        
        <p>This demo checks the first Tripous UI services.</p>
        
        <style>
            .overlay-spinner-demo {
                grid-template-columns: max-content 72px max-content max-content;
                max-width: 560px;
            }
            .overlay-spinner-demo label {
                font-weight: 600;
            }
            .overlay-spinner-demo input {
                width: 72px;
            }
            .overlay-spinner-demo button {
                min-width: 0;
                width: auto;
            }
        </style>
        
        <div class="html-code">
            <div class="demo-panel overlay-spinner-demo">
                <label for="DurationSeconds">Seconds</label>
                <input id="DurationSeconds" type="number" min="1" max="10" step="1" value="2" />
                <button id="ShowOverlayButton" type="button">Show Overlay</button>
                <button id="ShowSpinnerButton" type="button">Show Spinner</button>
                <pre id="DemoOutput"></pre>
            </div>
        </div>
        
        <script class="js-code">
            tp.Ready(function () {
                var Overlay = null;
                var OverlayTimerId = 0;
        
                var WriteLog = function (Message) {
                    var Lines = [
                        Message,
                        "overlay visible = " + (Overlay ? Overlay.Visible : false),
                        "spinner showing = " + tp.Spinner.IsShowing,
                        "spinner counter = " + tp.Spinner.ShowingCounter,
                        "time = " + new Date().toLocaleTimeString()
                    ];
        
                    tp.Text("#DemoOutput", Lines.join("\n"));
                };
        
                var GetDuration = function () {
                    var Result = Number(tp.Value("#DurationSeconds"));
        
                    if (!Number.isFinite(Result))
                        Result = 2;
        
                    Result = Math.max(1, Math.min(10, Result));
                    tp.Value("#DurationSeconds", Result);
        
                    return Result * 1000;
                };
        
                tp.On("#ShowOverlayButton", "click", function () {
                    if (!Overlay)
                        Overlay = new tp.ScreenOverlay();
        
                    clearTimeout(OverlayTimerId);
        
                    Overlay.Show();
                    WriteLog("Overlay shown.");
        
                    OverlayTimerId = setTimeout(function () {
                        if (Overlay)
                            Overlay.Hide();
        
                        WriteLog("Overlay auto-hidden.");
                    }, GetDuration());
                });
        
                tp.On("#ShowSpinnerButton", "click", function () {
                    tp.ShowSpinner(true);
                    WriteLog("Spinner show requested.");
        
                    setTimeout(function () {
                        tp.ShowSpinner(false);
                        WriteLog("Spinner auto-hidden.");
                    }, GetDuration());
                });
        
                WriteLog("Ready.");
            });
        </script>
    </main>

    <section id="DemoSourcePanel" class="demo-source-panel" hidden>
        <div class="demo-source-tabs">
            <button type="button" data-demo-source-tab="html">HTML</button>
            <button type="button" data-demo-source-tab="javascript">JavaScript</button>
        </div>
        <div class="demo-source-page" data-demo-source-page="html">
            <pre id="DemoHtmlEditor"></pre>
        </div>
        <div class="demo-source-page" data-demo-source-page="javascript">
            <pre id="DemoJavaScriptEditor"></pre>
        </div>
    </section>
</body>
</html>
