<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status bar</title>
    <link rel="stylesheet" href="../tripous/css/tp-Variables.css">
    <link rel="stylesheet" href="../tripous/css/tp.css">
    <link rel="stylesheet" href="../tripous/css/font-awesome.css">
    <link rel="stylesheet" href="../tripous/css/glyphicons.css">
    <link rel="stylesheet" href="../tripous/css/tp-UI.css">
    <link rel="stylesheet" href="../assets/css/demos.css">
    <script src="../tripous/js/tp.js"></script>
    <script src="../tripous/js/tp-Data.js"></script>
    <script src="../tripous/js/tp-UI.js"></script>
    <script src="../assets/js/demos.js"></script>
</head>
<body class="demo-page">
    <script>
        if (window.top !== window.self) {
            document.body.classList.add("is-embedded");
        }
        Demos.RegisterSourcePreview();
    </script>

    <main class="demo-body">
        <p class="demo-index-link">
            <a href="../index.html">Tripous Web Demos</a>
        </p>
        <h1>Status bar</h1>

        <p>
            <code>tp.StatusBar</code> is a lightweight component for shell status panels.
            It supports named items, constructor create params, <code>data-setup</code>, and public update methods.
        </p>

        <style>
            .status-bar-demo-layout {
                display: grid;
                gap: 14px;
                width: min(100%, 1040px);
            }
            .status-bar-demo-host {
                display: grid;
                gap: 8px;
                padding: 12px;
                border: 1px solid #d0d7de;
                background: #ffffff;
            }
            .status-bar-demo-host h2 {
                margin: 0;
                font-size: 16px;
            }
            .status-bar-demo-box {
                height: 28px;
                border: 1px solid #aeb7c1;
            }
            .status-bar-demo-actions {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
            }
            .status-bar-demo-output {
                box-sizing: border-box;
                width: 100%;
                min-height: 150px;
                margin: 0;
                padding: 12px;
                overflow: auto;
                border: 1px solid #d0d7de;
                background: #f0f3f6;
            }
        </style>

        <div class="html-code">
            <div class="status-bar-demo-layout">
                <section class="status-bar-demo-host">
                    <h2>Created from constructor params</h2>
                    <div id="ConstructorStatusBar" class="status-bar-demo-box"></div>
                </section>

                <section class="status-bar-demo-host">
                    <h2>Created from data-setup</h2>
                    <div id="DataSetupStatusBar"
                         class="status-bar-demo-box"
                         data-setup="{ DefaultItemName: 'Message', Items: [
                             { Name: 'Version', Text: 'tERP v1.0', Width: '1fr', TextAlign: 'left' },
                             { Name: 'User', Text: 'User: teo', Width: '150px', TextAlign: 'center' },
                             { Name: 'Role', Text: 'User Role: Admin', Width: '180px', TextAlign: 'center' },
                             { Name: 'Message', Text: 'Ready', Width: '1fr', TextAlign: 'center' }
                         ] }"></div>
                </section>

                <div class="status-bar-demo-actions">
                    <button id="SetMessageButton" type="button">Set message</button>
                    <button id="ToggleRoleButton" type="button">Toggle role</button>
                    <button id="AddItemButton" type="button">Add item</button>
                    <button id="DuplicateNameButton" type="button">Duplicate name</button>
                    <button id="ResetButton" type="button">Reset</button>
                </div>

                <pre id="StatusBarOutput" class="status-bar-demo-output"></pre>
            </div>
        </div>

        <script class="js-code">
            tp.Ready(function () {
                var Counter = 0;
                var RoleVisible = true;

                var ConstructorStatusBar = new tp.StatusBar({
                    ElementOrSelector: "#ConstructorStatusBar",
                    DefaultItemName: "Message",
                    Items: [
                        { Name: "Version", Text: "tERP Web", Width: "1fr", TextAlign: "left" },
                        { Name: "User", Text: "User: admin", Width: "150px", TextAlign: "center" },
                        { Name: "Role", Text: "User Role: Admin", Width: "180px", TextAlign: "center" },
                        { Name: "Message", Text: "Ready", Width: "1fr", TextAlign: "center" }
                    ]
                });

                var DataSetupStatusBar = new tp.StatusBar("#DataSetupStatusBar");

                function WriteOutput(Action) {
                    var Lines = [];
                    Lines.push(Action || "Ready.");
                    Lines.push("");
                    Lines.push("Constructor items: " + ConstructorStatusBar.Items.map(function (Item) {
                        return Item.Name + "=" + Item.Text;
                    }).join(" | "));
                    Lines.push("Data-setup items: " + DataSetupStatusBar.Items.map(function (Item) {
                        return Item.Name + "=" + Item.Text;
                    }).join(" | "));
                    Lines.push("ItemCount: " + ConstructorStatusBar.ItemCount);
                    tp.Text("#StatusBarOutput", Lines.join("\n"));
                }

                tp.On("#SetMessageButton", "click", function () {
                    ConstructorStatusBar.Message = "Updated at " + new Date().toLocaleTimeString();
                    DataSetupStatusBar.SetText("Message", "Updated through SetText()");
                    WriteOutput("Message updated.");
                });

                tp.On("#ToggleRoleButton", "click", function () {
                    RoleVisible = !RoleVisible;
                    ConstructorStatusBar.SetVisible("Role", RoleVisible);
                    DataSetupStatusBar.SetVisible("Role", RoleVisible);
                    WriteOutput("Role visibility changed.");
                });

                tp.On("#AddItemButton", "click", function () {
                    Counter++;
                    ConstructorStatusBar.Add("Dynamic" + Counter, "Dynamic " + Counter, "120px", null, "center");
                    DataSetupStatusBar.Add({ Name: "Dynamic" + Counter, Text: "Dynamic " + Counter, Width: "120px", TextAlign: "center" });
                    WriteOutput("Dynamic item added.");
                });

                tp.On("#DuplicateNameButton", "click", function () {
                    ConstructorStatusBar.Add("User", "User: duplicate update", "190px", null, "center");
                    DataSetupStatusBar.Add({ Name: "User", Text: "User: duplicate update", Width: "190px", TextAlign: "center" });
                    WriteOutput("Duplicate name updated the existing item.");
                });

                tp.On("#ResetButton", "click", function () {
                    Counter = 0;
                    RoleVisible = true;
                    ConstructorStatusBar.Clear();
                    ConstructorStatusBar.AddRange([
                        { Name: "Version", Text: "tERP Web", Width: "1fr", TextAlign: "left" },
                        { Name: "User", Text: "User: admin", Width: "150px", TextAlign: "center" },
                        { Name: "Role", Text: "User Role: Admin", Width: "180px", TextAlign: "center" },
                        { Name: "Message", Text: "Ready", Width: "1fr", TextAlign: "center" }
                    ]);
                    DataSetupStatusBar.Clear();
                    DataSetupStatusBar.AddRange([
                        { Name: "Version", Text: "tERP v1.0", Width: "1fr", TextAlign: "left" },
                        { Name: "User", Text: "User: teo", Width: "150px", TextAlign: "center" },
                        { Name: "Role", Text: "User Role: Admin", Width: "180px", TextAlign: "center" },
                        { Name: "Message", Text: "Ready", Width: "1fr", TextAlign: "center" }
                    ]);
                    WriteOutput("Status bars reset.");
                });

                WriteOutput();
            });
        </script>
    </main>

    <section id="DemoSourcePanel" class="demo-source-panel" hidden>
        <div class="demo-source-tabs">
            <button type="button" data-demo-source-tab="html">HTML</button>
            <button type="button" data-demo-source-tab="javascript">JavaScript</button>
        </div>
        <div class="demo-source-page" data-demo-source-page="html">
            <pre id="DemoHtmlEditor"></pre>
        </div>
        <div class="demo-source-page" data-demo-source-page="javascript">
            <pre id="DemoJavaScriptEditor"></pre>
        </div>
    </section>
</body>
</html>
