<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tp.TreeView</title>
    <link rel="stylesheet" href="../tripous/css/tp-Variables.css">
    <link rel="stylesheet" href="../tripous/css/tp.css">
    <link rel="stylesheet" href="../tripous/css/font-awesome.css">
    <link rel="stylesheet" href="../tripous/css/glyphicons.css">
    <link rel="stylesheet" href="../tripous/css/tp-UI.css">
    <link rel="stylesheet" href="../assets/css/demos.css">
    <script src="../tripous/js/tp.js"></script>
    <script src="../tripous/js/tp-Data.js"></script>
    <script src="../tripous/js/tp-UI.js"></script>
    <script src="../assets/js/demos.js"></script>
</head>
<body class="demo-page">
    <script>
        if (window.top !== window.self) {
            document.body.classList.add("is-embedded");
        }
        Demos.RegisterSourcePreview();
    </script>

    <main class="demo-body">
        <p class="demo-index-link">
            <a href="../index.html">Tripous Web Demos</a>
        </p>
        <h1>tp.TreeView</h1>
        
        <p>
            A tree control composed of <code>tp.TreeNode</code> objects.
            Nodes support text, tooltip, URL, icon classes, image URL, and child node operations.
        </p>
        
        <style>
            .tree-view-demo-layout {
                display: grid;
                grid-template-columns: minmax(260px, 320px) minmax(260px, 1fr);
                gap: 14px;
                align-items: start;
                width: min(100%, 820px);
            }
            .tree-view-demo-actions {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                align-items: center;
                margin: 12px 0;
            }
            .tree-view-demo-text {
                box-sizing: border-box;
                width: min(100%, 320px);
                height: 30px;
            }
            .tree-view-demo-log {
                box-sizing: border-box;
                width: min(100%, 440px);
                min-height: 190px;
                padding: 12px;
                overflow: auto;
                border: 1px solid #d0d7de;
                background: #f0f3f6;
            }
            @media (max-width: 760px) {
                .tree-view-demo-layout {
                    grid-template-columns: minmax(0, 1fr);
                }
            }
        </style>
        
        <div class="html-code">
            <div class="tree-view-demo-layout">
                <div>
                    <input id="TreeViewText" class="tree-view-demo-text" type="text" value="This is a node display text, quite long, so to check the overflow" />
        
                    <div class="tree-view-demo-actions">
                        <button id="TreeViewSetTextButton" type="button">Set Text</button>
                        <button id="TreeViewAddButton" type="button">Add Child</button>
                        <button id="TreeViewRemoveButton" type="button">Remove</button>
                        <button id="TreeViewExpandButton" type="button">Expand All</button>
                        <button id="TreeViewCollapseButton" type="button">Collapse All</button>
                        <button id="TreeViewLogButton" type="button">Log</button>
                    </div>
        
                    <div id="TreeView" data-setup="{ Height: 300, Width: 280 }">
                        <div data-setup="{ ImageUrl: '../tripous/images/demos/Home.png', Url: 'https://w3c.github.io/html/dom.html', ToolTip: 'External link' }">This is a link to w3c with a long title that should force horizontal scrolling</div>
                        <div>
                            Node
                            <div>Leaf</div>
                            <div>
                                Node
                                <div>Leaf</div>
                                <div>Leaf 2</div>
                            </div>
                        </div>
                    </div>
                </div>
        
                <pre id="TreeViewOutput" class="tree-view-demo-log"></pre>
            </div>
        </div>
        
        <script class="js-code">
            tp.Ready(function () {
                var TreeView = new tp.TreeView({
                    ElementOrSelector: "#TreeView"
                });
                var LastNode = null;
        
                var WriteLog = function (Message) {
                    var NodeText = LastNode ? LastNode.Text : "";
                    tp.Text("#TreeViewOutput", [
                        Message || "Ready.",
                        "root count = " + TreeView.Count,
                        "last node = " + NodeText,
                        "level = " + (LastNode ? LastNode.Level : ""),
                        "index = " + (LastNode ? LastNode.Index : ""),
                        "children = " + (LastNode ? LastNode.Count : "")
                    ].join("\n"));
                };
        
                TreeView.On("NodeClick", function (Args) {
                    LastNode = Args.Node;
                    WriteLog("Node clicked.");
                });
        
                TreeView.On("Expanded", function (Args) {
                    LastNode = Args.Node;
                    WriteLog("Node expanded.");
                });
        
                TreeView.On("Collapsed", function (Args) {
                    LastNode = Args.Node;
                    WriteLog("Node collapsed.");
                });
        
                tp.On("#TreeViewSetTextButton", "click", function () {
                    if (LastNode) {
                        LastNode.Text = tp.Value("#TreeViewText") || "A node";
                        WriteLog("Text assigned.");
                    }
                });
        
                tp.On("#TreeViewAddButton", "click", function () {
                    if (LastNode) {
                        LastNode.AddNode(tp.Value("#TreeViewText") || "New node");
                        LastNode.Expand();
                        WriteLog("Child added.");
                    }
                });
        
                tp.On("#TreeViewRemoveButton", "click", function () {
                    if (LastNode && LastNode.ParentTreeNode) {
                        LastNode.ParentTreeNode.Remove(LastNode);
                        LastNode = null;
                        WriteLog("Node removed.");
                    }
                });
        
                tp.On("#TreeViewExpandButton", "click", function () {
                    TreeView.ExpandAll();
                    WriteLog("Expanded all.");
                });
        
                tp.On("#TreeViewCollapseButton", "click", function () {
                    TreeView.CollapseAll();
                    WriteLog("Collapsed all.");
                });
        
                tp.On("#TreeViewLogButton", "click", function () {
                    WriteLog("Current values.");
                });
        
                WriteLog();
            });
        </script>
    </main>

    <section id="DemoSourcePanel" class="demo-source-panel" hidden>
        <div class="demo-source-tabs">
            <button type="button" data-demo-source-tab="html">HTML</button>
            <button type="button" data-demo-source-tab="javascript">JavaScript</button>
        </div>
        <div class="demo-source-page" data-demo-source-page="html">
            <pre id="DemoHtmlEditor"></pre>
        </div>
        <div class="demo-source-page" data-demo-source-page="javascript">
            <pre id="DemoJavaScriptEditor"></pre>
        </div>
    </section>
</body>
</html>
