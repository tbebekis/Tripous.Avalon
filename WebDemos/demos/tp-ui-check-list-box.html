<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tp.CheckListBox</title>
    <link rel="stylesheet" href="../tripous/css/tp-Variables.css">
    <link rel="stylesheet" href="../tripous/css/tp.css">
    <link rel="stylesheet" href="../tripous/css/font-awesome.css">
    <link rel="stylesheet" href="../tripous/css/glyphicons.css">
    <link rel="stylesheet" href="../tripous/css/tp-UI.css">
    <link rel="stylesheet" href="../assets/css/demos.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.2/ace.js"></script>
    <script src="../tripous/js/tp.js"></script>
    <script src="../tripous/js/tp-Data.js"></script>
    <script src="../tripous/js/tp-UI.js"></script>
    <script src="../assets/js/demos.js"></script>
</head>
<body class="demo-page">
    <script>
        if (window.top !== window.self) {
            document.body.classList.add("is-embedded");
        }
        Demos.RegisterSourcePreview();
    </script>

    <main class="demo-body">
        <p class="demo-index-link">
            <a href="../index.html">Tripous Web Demos</a>
        </p>
        <h1>tp.CheckListBox</h1>
        
        <p>
            A virtual-scroller based multi-select list box with check boxes.
            It exposes <code>Items</code>, <code>SelectedIndexes</code>, <code>SelectedValues</code>,
            <code>ListDisplayField</code>, and <code>ListValueField</code>.
        </p>
        
        <style>
            .check-list-box-demo-layout {
                display: grid;
                grid-template-columns: minmax(220px, 320px) minmax(260px, 1fr);
                gap: 14px;
                align-items: start;
                width: min(100%, 760px);
            }
            .check-list-box-demo-list {
                height: 220px;
                width: 280px;
            }
            .check-list-box-demo-actions {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                align-items: center;
                margin: 12px 0;
            }
            .check-list-box-demo-log {
                box-sizing: border-box;
                width: min(100%, 420px);
                min-height: 160px;
                padding: 12px;
                overflow: auto;
                border: 1px solid #d0d7de;
                background: #f0f3f6;
            }
            @media (max-width: 720px) {
                .check-list-box-demo-layout {
                    grid-template-columns: minmax(0, 1fr);
                }
            }
        </style>
        
        <div class="html-code">
            <div class="check-list-box-demo-layout">
                <div>
                    <div id="CheckListBox" class="check-list-box-demo-list" data-setup="{ListValueField: 'Id', ListDisplayField: 'Name', SelectedValues: [100, 1], List: [{Id: 100, Name: 'All'}, {Id: 0, Name: 'No stops'}, {Id: 1, Name: '1 stop'}]}"></div>
        
                    <div class="check-list-box-demo-actions">
                        <button id="CheckListBoxSetItemsButton" type="button">Set 100 Items</button>
                        <button id="CheckListBoxCheckFirstButton" type="button">Check First</button>
                        <button id="CheckListBoxClearButton" type="button">Clear Selection</button>
                        <button id="CheckListBoxLogButton" type="button">Log</button>
                    </div>
                </div>
        
                <pre id="CheckListBoxOutput" class="check-list-box-demo-log"></pre>
            </div>
        </div>
        
        <script class="js-code">
            tp.Ready(function () {
                var CheckListBox = new tp.CheckListBox({
                    ElementOrSelector: "#CheckListBox"
                });
        
                var CreateList = function (Count) {
                    var Result = [];
                    var Index;
                    for (Index = 0; Index < Count; Index++) {
                        Result.push({
                            Id: Index + 1,
                            Name: "Name " + (Index + 1)
                        });
                    }
                    return Result;
                };
        
                var WriteLog = function (Message) {
                    tp.Text("#CheckListBoxOutput", [
                        Message || "Ready.",
                        "count = " + CheckListBox.Count,
                        "selected indexes = " + CheckListBox.SelectedIndexes.join(", "),
                        "selected values = " + CheckListBox.SelectedValues.join(", ")
                    ].join("\n"));
                };
        
                CheckListBox.On("SelectionChanged", function () {
                    WriteLog("Selection changed.");
                });
        
                tp.On("#CheckListBoxSetItemsButton", "click", function () {
                    CheckListBox.Items = CreateList(100);
                    CheckListBox.SelectedValues = [1, 2, 3];
                    WriteLog("List replaced.");
                });
        
                tp.On("#CheckListBoxCheckFirstButton", "click", function () {
                    CheckListBox.CheckIndex(0, true);
                    WriteLog("First item checked.");
                });
        
                tp.On("#CheckListBoxClearButton", "click", function () {
                    CheckListBox.SelectedIndexes = [];
                    WriteLog("Selection cleared.");
                });
        
                tp.On("#CheckListBoxLogButton", "click", function () {
                    WriteLog("Current values.");
                });
        
                WriteLog();
            });
        </script>
    </main>

    <section id="DemoSourcePanel" class="demo-source-panel" hidden>
        <div class="demo-source-tabs">
            <button type="button" data-demo-source-tab="html">HTML</button>
            <button type="button" data-demo-source-tab="javascript">JavaScript</button>
        </div>
        <div class="demo-source-page" data-demo-source-page="html">
            <pre id="DemoHtmlEditor"></pre>
        </div>
        <div class="demo-source-page" data-demo-source-page="javascript">
            <pre id="DemoJavaScriptEditor"></pre>
        </div>
    </section>
</body>
</html>
