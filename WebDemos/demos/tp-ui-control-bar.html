<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tp.ControlBar</title>
    <link rel="stylesheet" href="../tripous/css/tp-Variables.css">
    <link rel="stylesheet" href="../tripous/css/tp.css">
    <link rel="stylesheet" href="../tripous/css/font-awesome.css">
    <link rel="stylesheet" href="../tripous/css/glyphicons.css">
    <link rel="stylesheet" href="../tripous/css/tp-UI.css">
    <link rel="stylesheet" href="../assets/css/demos.css">
    <script src="../tripous/js/tp.js"></script>
    <script src="../tripous/js/tp-Data.js"></script>
    <script src="../tripous/js/tp-UI.js"></script>
    <script src="../assets/js/demos.js"></script>
</head>
<body class="demo-page">
    <script>
        if (window.top !== window.self) {
            document.body.classList.add("is-embedded");
        }
        Demos.RegisterSourcePreview();
    </script>

    <main class="demo-body">
        <p class="demo-index-link">
            <a href="../index.html">Tripous Web Demos</a>
        </p>
        <h1>tp.ControlBar</h1>

        <style>
            .controlbar-demo-actions {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-bottom: 12px;
            }
            .controlbar-demo-area {
                display: grid;
                gap: 12px;
                max-width: 980px;
            }
            .controlbar-demo-bar {
                padding: 2px 0;
                border: 1px solid #d0d7de;
                background: #f6f8fa;
            }
            .controlbar-demo-bar .tp-Separator {
                width: 1px;
                height: 24px;
                margin: 0 4px;
                background: #8c959f;
            }
            .controlbar-demo-output {
                box-sizing: border-box;
                width: min(100%, 760px);
                min-height: 110px;
                padding: 12px;
                overflow: auto;
                border: 1px solid #d0d7de;
                background: #f0f3f6;
            }
        </style>

        <div class="html-code">
            <div class="controlbar-demo-actions">
                <button id="InsertBeforeButton" type="button">InsertBefore</button>
                <button id="InsertAfterButton" type="button">InsertAfter</button>
                <button id="PlaceBeforeButton" type="button">PlaceControlBefore</button>
                <button id="PlaceAfterButton" type="button">PlaceControlAfter</button>
                <button id="RemoveButton" type="button">Remove selected</button>
                <button id="RemoveAllButton" type="button">RemoveAll</button>
                <button id="RebuildButton" type="button">Rebuild</button>
            </div>

            <div class="controlbar-demo-area">
                <div id="ControlBar" class="controlbar-demo-bar"></div>
                <pre id="ControlBarOutput" class="controlbar-demo-output"></pre>
            </div>
        </div>

        <script class="js-code">
            tp.Ready(function () {
                var Bar = new tp.ControlBar("#ControlBar");
                var Counter = 0;
                var Selected = null;

                var WriteLog = function (Message) {
                    var Items = Bar.GetItemList().map(function (Item) {
                        if (tp.HasCommandProperty(Item) && !tp.IsBlank(Item.Command)) {
                            return Item.Command;
                        }
                        if (Item instanceof HTMLElement) {
                            return Item.textContent.trim() || Item.id || Item.tagName.toLowerCase();
                        }
                        return Item && Item.tpClass ? Item.tpClass : "item";
                    });
                    tp.Text("#ControlBarOutput", [
                        Message || "Ready.",
                        "selected = " + (Selected && tp.HasCommandProperty(Selected) ? Selected.Command : "(none)"),
                        "items = " + Items.join(", ")
                    ].join("\n"));
                };

                var SelectItem = function (Item) {
                    var List = Bar.GetItemList();
                    List.forEach(function (Entry) {
                        var Element = Entry instanceof tp.Component ? Entry.Handle : Entry;
                        if (Element instanceof HTMLElement) {
                            Element.style.outline = "";
                        }
                    });
                    Selected = Item;
                    if (Selected instanceof tp.Component) {
                        Selected.Handle.style.outline = "2px solid #0969da";
                    }
                    WriteLog("Selected: " + Selected.Command);
                };

                var WireButtonEx = function (Button) {
                    tp.AddClass(Button.Handle, tp.Classes.ToolButton);
                    Button.On(tp.Events.Click, function () {
                        SelectItem(Button);
                    });
                    Button.On(tp.Events.Click, function (Args) {
                        Bar.OnButtonClick(new tp.ToolBarItemClickEventArgs(Button, Args && !tp.IsBlank(Args.Command) ? Args.Command : Button.Command));
                    });
                    return Button;
                };

                var IconUrl = function (Name) {
                    return "../tripous/images/demos/" + Name + ".png";
                };

                var CreateButtonEx = function (Text, Command, ImageUrl) {
                    return WireButtonEx(new tp.ButtonEx({
                        Text: Text,
                        Command: Command,
                        ToolTip: Text,
                        ImageUrl: ImageUrl || "",
                        IcoMode: tp.ButtonExIcoMode.Left,
                        NoText: true
                    }));
                };

                var AddDemoButtonEx = function (Text, Command, ImageUrl) {
                    var Button = CreateButtonEx(Text, Command, ImageUrl);
                    Bar.AddControl(Button);
                    return Button;
                };

                var AddDynamicButton = function (TextPrefix) {
                    Counter++;
                    var Command = TextPrefix + Counter;
                    return CreateButtonEx(TextPrefix + " " + Counter, Command, IconUrl("Home1"));
                };

                var Rebuild = function () {
                    Bar.RemoveAll(true);
                    Counter = 0;
                    Selected = null;
                    AddDemoButtonEx("Refresh", "Refresh", IconUrl("Home"));
                    AddDemoButtonEx("Insert", "Insert", IconUrl("Insert"));
                    AddDemoButtonEx("Edit", "Edit", IconUrl("Edit"));
                    AddDemoButtonEx("Delete", "Delete", IconUrl("Delete"));
                    Bar.AddSeparator("OptionsSeparator");
                    Bar.AddLabel("View");
                    Bar.AddComboBox(["Default", "Active", "Inactive"], 0, 150);
                    Bar.AddCheckBox("Pinned", true);
                    WriteLog("Rebuilt.");
                };

                Bar.On("ButtonClick", function (Args) {
                    WriteLog("ButtonClick: " + Args.Command);
                });

                tp.On("#InsertBeforeButton", "click", function () {
                    var Pivot = Bar.FindItemByCommand("Edit");
                    var Button = AddDynamicButton("Before");
                    Bar.InsertBefore(Pivot, Button);
                    SelectItem(Button);
                    WriteLog("Inserted before Edit.");
                });

                tp.On("#InsertAfterButton", "click", function () {
                    var Pivot = Bar.FindItemByCommand("Edit");
                    var Button = AddDynamicButton("After");
                    Bar.InsertAfter(Pivot, Button);
                    SelectItem(Button);
                    WriteLog("Inserted after Edit.");
                });

                tp.On("#PlaceBeforeButton", "click", function () {
                    var Pivot = Bar.FindItemByCommand("Refresh");
                    if (Selected) {
                        Bar.PlaceControlBefore(Pivot, Selected);
                        WriteLog("Selected item placed before Refresh.");
                    }
                });

                tp.On("#PlaceAfterButton", "click", function () {
                    var Pivot = Bar.FindItemByCommand("Delete");
                    if (Selected) {
                        Bar.PlaceControlAfter(Pivot, Selected);
                        WriteLog("Selected item placed after Delete.");
                    }
                });

                tp.On("#RemoveButton", "click", function () {
                    if (Selected) {
                        Bar.Remove(Selected, true);
                        Selected = null;
                        WriteLog("Selected item removed.");
                    }
                });

                tp.On("#RemoveAllButton", "click", function () {
                    Bar.RemoveAll(true);
                    Selected = null;
                    WriteLog("All items removed.");
                });

                tp.On("#RebuildButton", "click", Rebuild);

                Rebuild();
            });
        </script>
    </main>

    <section id="DemoSourcePanel" class="demo-source-panel" hidden>
        <div class="demo-source-tabs">
            <button type="button" data-demo-source-tab="html">HTML</button>
            <button type="button" data-demo-source-tab="javascript">JavaScript</button>
        </div>
        <div class="demo-source-page" data-demo-source-page="html">
            <pre id="DemoHtmlEditor"></pre>
        </div>
        <div class="demo-source-page" data-demo-source-page="javascript">
            <pre id="DemoJavaScriptEditor"></pre>
        </div>
    </section>
</body>
</html>
