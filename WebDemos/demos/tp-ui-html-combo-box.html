<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tp.HtmlComboBox</title>
    <link rel="stylesheet" href="../tripous/css/tp-Variables.css">
    <link rel="stylesheet" href="../tripous/css/tp.css">
    <link rel="stylesheet" href="../tripous/css/font-awesome.css">
    <link rel="stylesheet" href="../tripous/css/glyphicons.css">
    <link rel="stylesheet" href="../tripous/css/tp-UI.css">
    <link rel="stylesheet" href="../assets/css/demos.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.2/ace.js"></script>
    <script src="../tripous/js/tp.js"></script>
    <script src="../tripous/js/tp-Data.js"></script>
    <script src="../tripous/js/tp-UI.js"></script>
    <script src="../assets/js/demos.js"></script>
</head>
<body class="demo-page">
    <script>
        if (window.top !== window.self) {
            document.body.classList.add("is-embedded");
        }
        Demos.RegisterSourcePreview();
    </script>

    <main class="demo-body">
        <p class="demo-index-link">
            <a href="../index.html">Tripous Web Demos</a>
        </p>
        <h1>tp.HtmlComboBox</h1>
        
        <p>
            This demo shows the native HTML select wrapped by <code>tp.HtmlComboBox</code>. The control reads its initial setup from <code>data-setup</code>.
            Use the buttons to change selection or replace the list.
        </p>
        
        <style>
            .demo-buttons {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin: 12px 0;
            }
        
            #HtmlComboLog {
                min-height: 120px;
                white-space: pre-wrap;
            }
        </style>
        
        <select id="HtmlComboBox" data-setup="{ Width: 220, List: ['Mercury', 'Venus', 'Earth', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune'], SelectedIndex: 2 }"></select>
        
        <div class="demo-buttons">
            <button id="HtmlComboSelectFirstButton" type="button">Select First</button>
            <button id="HtmlComboSelectMiddleButton" type="button">Select Middle</button>
            <button id="HtmlComboSetListButton" type="button">Set 100 Items</button>
            <button id="HtmlComboLogButton" type="button">Log</button>
        </div>
        
        <pre id="HtmlComboLog"></pre>
        
        <script>
            tp.Ready(function () {
                var HtmlComboBox = new tp.HtmlComboBox({
                    ElementOrSelector: "#HtmlComboBox"
                });
        
                var CreateLargeList = function (Count) {
                    var Result = [];
                    for (var i = 0; i < Count; i++)
                        Result.push("Item " + tp.PadLeft(i + 1, "0", 3));
                    return Result;
                };
        
                var GetSelectedText = function () {
                    var Item = HtmlComboBox.SelectedItem;
                    return Item ? Item.text : "";
                };
        
                var WriteLog = function (Message) {
                    var Lines = [];
                    if (Message)
                        Lines.push(Message);
        
                    Lines.push("Count: " + HtmlComboBox.Count);
                    Lines.push("SelectedIndex: " + HtmlComboBox.SelectedIndex);
                    Lines.push("SelectedValue: " + HtmlComboBox.SelectedValue);
                    Lines.push("Selected text: " + GetSelectedText());
        
                    tp.Select("#HtmlComboLog").textContent = Lines.join("\n");
                };
        
                HtmlComboBox.On("SelectedIndexChanged", function () {
                    WriteLog("Selection changed.");
                });
        
                tp.On("#HtmlComboSelectFirstButton", "click", function () {
                    HtmlComboBox.SelectedIndex = 0;
                    WriteLog("First item selected.");
                });
        
                tp.On("#HtmlComboSelectMiddleButton", "click", function () {
                    HtmlComboBox.SelectedIndex = Math.floor(HtmlComboBox.Count / 2);
                    WriteLog("Middle item selected.");
                });
        
                tp.On("#HtmlComboSetListButton", "click", function () {
                    HtmlComboBox.List = CreateLargeList(100);
                    HtmlComboBox.SelectedIndex = 50;
                    WriteLog("List replaced with 100 items.");
                });
        
                tp.On("#HtmlComboLogButton", "click", function () {
                    WriteLog("Current values.");
                });
        
                WriteLog();
            });
        </script>
    </main>

    <section id="DemoSourcePanel" class="demo-source-panel" hidden>
        <div class="demo-source-tabs">
            <button type="button" data-demo-source-tab="html">HTML</button>
            <button type="button" data-demo-source-tab="javascript">JavaScript</button>
        </div>
        <div class="demo-source-page" data-demo-source-page="html">
            <pre id="DemoHtmlEditor"></pre>
        </div>
        <div class="demo-source-page" data-demo-source-page="javascript">
            <pre id="DemoJavaScriptEditor"></pre>
        </div>
    </section>
</body>
</html>
