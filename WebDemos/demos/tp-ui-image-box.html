<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tp.ImageBox</title>
    <link rel="stylesheet" href="../tripous/css/tp-Variables.css">
    <link rel="stylesheet" href="../tripous/css/tp.css">
    <link rel="stylesheet" href="../tripous/css/font-awesome.css">
    <link rel="stylesheet" href="../tripous/css/glyphicons.css">
    <link rel="stylesheet" href="../tripous/css/tp-UI.css">
    <link rel="stylesheet" href="../assets/css/demos.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.2/ace.js"></script>
    <script src="../tripous/js/tp.js"></script>
    <script src="../tripous/js/tp-Data.js"></script>
    <script src="../tripous/js/tp-UI.js"></script>
    <script src="../assets/js/demos.js"></script>
</head>
<body class="demo-page">
    <script>
        if (window.top !== window.self) {
            document.body.classList.add("is-embedded");
        }
        Demos.RegisterSourcePreview();
    </script>

    <main class="demo-body">
        <p class="demo-index-link">
            <a href="../index.html">Tripous Web Demos</a>
        </p>
        <h1>tp.ImageBox</h1>
        
        <p>
            An image control based on a <code>div</code> element and CSS background properties.
            It is not an <code>img</code> element.
        </p>
        
        <p>
            Change the image mode to test <code>Crop</code>, <code>Scale</code>, and <code>Stretch</code>.
        </p>
        
        <style>
            .image-box-demo-actions {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                align-items: center;
                margin-bottom: 12px;
            }
            .image-box-demo-actions select {
                min-width: 140px;
            }
            .image-box-demo-frame {
                box-sizing: border-box;
                width: min(100%, 420px);
                padding: 8px;
                border: 1px solid #d0d7de;
                margin-bottom: 12px;
            }
            .image-box-demo-log {
                box-sizing: border-box;
                width: min(100%, 700px);
                min-height: 110px;
                padding: 12px;
                overflow: auto;
                border: 1px solid #d0d7de;
                background: #f0f3f6;
            }
        </style>
        
        <div class="html-code">
            <div class="image-box-demo-actions">
                <label for="ImageBoxMode">Image mode</label>
                <select id="ImageBoxMode">
                    <option value="Crop">Crop</option>
                    <option value="Scale">Scale</option>
                    <option value="Stretch">Stretch</option>
                </select>
                <button id="ImageBoxGardenButton" type="button">Garden</button>
                <button id="ImageBoxKefaloniaButton" type="button">Kefalonia</button>
                <button id="ImageBoxLogButton" type="button">Log</button>
            </div>
        
            <div class="image-box-demo-frame">
                <div id="ImageBox" data-setup='{ Url: "../tripous/images/demos/Kefalonia.jpg", Width: "100%", Height: 260, ImageMode: "Crop" }'></div>
            </div>
        
            <pre id="ImageBoxOutput" class="image-box-demo-log"></pre>
        </div>
        
        <script class="js-code">
            tp.Ready(function () {
                var ImageBox = new tp.ImageBox({
                    ElementOrSelector: "#ImageBox"
                });
                var ModeSelect = tp("#ImageBoxMode");
        
                var ModeName = function (Mode) {
                    if (Mode === tp.ImageSizeMode.Crop)
                        return "Crop";
                    if (Mode === tp.ImageSizeMode.Scale)
                        return "Scale";
                    if (Mode === tp.ImageSizeMode.Stretch)
                        return "Stretch";
                    return "Unknown";
                };
        
                var WriteLog = function (Message) {
                    tp.Text("#ImageBoxOutput", [
                        Message || "Ready.",
                        "url = " + ImageBox.Url,
                        "image mode = " + ModeName(ImageBox.ImageMode),
                        "width = " + ImageBox.Width,
                        "height = " + ImageBox.Height
                    ].join("\n"));
                };
        
                tp.On(ModeSelect, "change", function () {
                    ImageBox.ImageMode = ModeSelect.value;
                    WriteLog("Image mode changed.");
                });
        
                tp.On("#ImageBoxGardenButton", "click", function () {
                    ImageBox.Url = "../tripous/images/demos/Garden.jpg";
                    WriteLog("Image changed.");
                });
        
                tp.On("#ImageBoxKefaloniaButton", "click", function () {
                    ImageBox.Url = "../tripous/images/demos/Kefalonia.jpg";
                    WriteLog("Image changed.");
                });
        
                tp.On("#ImageBoxLogButton", "click", function () {
                    WriteLog("Current values.");
                });
        
                WriteLog();
            });
        </script>
    </main>

    <section id="DemoSourcePanel" class="demo-source-panel" hidden>
        <div class="demo-source-tabs">
            <button type="button" data-demo-source-tab="html">HTML</button>
            <button type="button" data-demo-source-tab="javascript">JavaScript</button>
        </div>
        <div class="demo-source-page" data-demo-source-page="html">
            <pre id="DemoHtmlEditor"></pre>
        </div>
        <div class="demo-source-page" data-demo-source-page="javascript">
            <pre id="DemoJavaScriptEditor"></pre>
        </div>
    </section>
</body>
</html>
