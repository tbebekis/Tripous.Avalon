<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tp.HtmlDateBox</title>
    <link rel="stylesheet" href="../tripous/css/tp-Variables.css">
    <link rel="stylesheet" href="../tripous/css/tp.css">
    <link rel="stylesheet" href="../tripous/css/font-awesome.css">
    <link rel="stylesheet" href="../tripous/css/glyphicons.css">
    <link rel="stylesheet" href="../tripous/css/tp-UI.css">
    <link rel="stylesheet" href="../assets/css/demos.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.2/ace.js"></script>
    <script src="../tripous/js/tp.js"></script>
    <script src="../tripous/js/tp-Data.js"></script>
    <script src="../tripous/js/tp-UI.js"></script>
    <script src="../assets/js/demos.js"></script>
</head>
<body class="demo-page">
    <script>
        if (window.top !== window.self) {
            document.body.classList.add("is-embedded");
        }
        Demos.RegisterSourcePreview();
    </script>

    <main class="demo-body">
        <p class="demo-index-link">
            <a href="../index.html">Tripous Web Demos</a>
        </p>
        <h1>tp.HtmlDateBox</h1>
        
        <p>
            A native HTML <code>input type="date"</code> control.
            It exposes <code>Date</code>, <code>Value</code>, <code>Min</code>, <code>Max</code>, <code>Step</code>, and <code>TextAlign</code>.
        </p>
        
        <style>
            .html-date-box-demo-layout {
                display: grid;
                grid-template-columns: minmax(220px, 320px) minmax(260px, 1fr);
                gap: 14px;
                align-items: start;
                width: min(100%, 760px);
            }
            .html-date-box-demo-control {
                width: 180px;
                height: 30px;
            }
            .html-date-box-demo-actions {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                align-items: center;
                margin: 12px 0;
            }
            .html-date-box-demo-log {
                box-sizing: border-box;
                width: min(100%, 420px);
                min-height: 170px;
                padding: 12px;
                overflow: auto;
                border: 1px solid #d0d7de;
                background: #f0f3f6;
            }
            @media (max-width: 720px) {
                .html-date-box-demo-layout {
                    grid-template-columns: minmax(0, 1fr);
                }
            }
        </style>
        
        <div class="html-code">
            <div class="html-date-box-demo-layout">
                <div>
                    <input id="HtmlDateBox" class="html-date-box-demo-control" type="date" data-setup="{ Date: '2000-12-25', Min: '1990-01-01', Max: '2035-12-31', Step: 1 }" />
        
                    <div class="html-date-box-demo-actions">
                        <button id="HtmlDateBoxTodayButton" type="button">Today</button>
                        <button id="HtmlDateBoxSetButton" type="button">Set 2000-05-08</button>
                        <button id="HtmlDateBoxClearButton" type="button">Clear</button>
                        <button id="HtmlDateBoxMinMaxButton" type="button">Min/Max 2026</button>
                        <button id="HtmlDateBoxStepButton" type="button">Step 7</button>
                        <button id="HtmlDateBoxLeftButton" type="button">Left</button>
                        <button id="HtmlDateBoxRightButton" type="button">Right</button>
                        <button id="HtmlDateBoxLogButton" type="button">Log</button>
                    </div>
                </div>
        
                <pre id="HtmlDateBoxOutput" class="html-date-box-demo-log"></pre>
            </div>
        </div>
        
        <script class="js-code">
            tp.Ready(function () {
                var HtmlDateBox = new tp.HtmlDateBox({
                    ElementOrSelector: "#HtmlDateBox"
                });
        
                var FormatDate = function (Value) {
                    return tp.IsValidDate(Value) ? tp.FormatDateTime(Value, "yyyy-MM-dd") : "";
                };
        
                var WriteLog = function (Message) {
                    tp.Text("#HtmlDateBoxOutput", [
                        Message || "Ready.",
                        "date = " + FormatDate(HtmlDateBox.Date),
                        "value = " + HtmlDateBox.Value,
                        "min = " + FormatDate(HtmlDateBox.Min),
                        "max = " + FormatDate(HtmlDateBox.Max),
                        "step = " + HtmlDateBox.Step
                    ].join("\n"));
                };
        
                HtmlDateBox.On("ValueChanged", function () {
                    WriteLog("Value changed.");
                });
        
                tp.On("#HtmlDateBoxTodayButton", "click", function () {
                    HtmlDateBox.Date = new Date();
                    WriteLog("Today selected.");
                });
        
                tp.On("#HtmlDateBoxSetButton", "click", function () {
                    HtmlDateBox.Date = "2000-05-08";
                    WriteLog("Date set.");
                });
        
                tp.On("#HtmlDateBoxClearButton", "click", function () {
                    HtmlDateBox.Date = null;
                    WriteLog("Date cleared.");
                });
        
                tp.On("#HtmlDateBoxMinMaxButton", "click", function () {
                    HtmlDateBox.Min = "2026-01-01";
                    HtmlDateBox.Max = "2026-12-31";
                    WriteLog("Min and max set.");
                });
        
                tp.On("#HtmlDateBoxStepButton", "click", function () {
                    HtmlDateBox.Step = 7;
                    WriteLog("Step set.");
                });
        
                tp.On("#HtmlDateBoxLeftButton", "click", function () {
                    HtmlDateBox.TextAlign = "left";
                    WriteLog("Left aligned.");
                });
        
                tp.On("#HtmlDateBoxRightButton", "click", function () {
                    HtmlDateBox.TextAlign = "right";
                    WriteLog("Right aligned.");
                });
        
                tp.On("#HtmlDateBoxLogButton", "click", function () {
                    WriteLog("Current values.");
                });
        
                WriteLog();
            });
        </script>
    </main>

    <section id="DemoSourcePanel" class="demo-source-panel" hidden>
        <div class="demo-source-tabs">
            <button type="button" data-demo-source-tab="html">HTML</button>
            <button type="button" data-demo-source-tab="javascript">JavaScript</button>
        </div>
        <div class="demo-source-page" data-demo-source-page="html">
            <pre id="DemoHtmlEditor"></pre>
        </div>
        <div class="demo-source-page" data-demo-source-page="javascript">
            <pre id="DemoJavaScriptEditor"></pre>
        </div>
    </section>
</body>
</html>
