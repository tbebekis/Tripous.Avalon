<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tp Reflection</title>
    <link rel="stylesheet" href="../tripous/css/tp-Variables.css">
    <link rel="stylesheet" href="../tripous/css/tp.css">
    <link rel="stylesheet" href="../tripous/css/font-awesome.css">
    <link rel="stylesheet" href="../tripous/css/glyphicons.css">
    <link rel="stylesheet" href="../tripous/css/tp-UI.css">
    <link rel="stylesheet" href="../assets/css/demos.css">
    <script src="../tripous/js/tp.js"></script>
    <script src="../tripous/js/tp-Data.js"></script>
    <script src="../tripous/js/tp-UI.js"></script>
    <script src="../assets/js/demos.js"></script>
</head>
<body class="demo-page">
    <script>
        if (window.top !== window.self) {
            document.body.classList.add("is-embedded");
        }
        Demos.RegisterSourcePreview();
    </script>

    <main class="demo-body">
        <p class="demo-index-link">
            <a href="../index.html">Tripous Web Demos</a>
        </p>
        <h1>tp Reflection</h1>
        
        <p>
            This demo uses the Tripous reflection helpers to inspect important runtime classes.
            Select a class to view its properties and methods.
        </p>
        
        <style>
            .reflection-demo-layout {
                display: grid;
                grid-template-columns: minmax(234px, 338px) minmax(0, 1fr);
                gap: 14px;
                width: min(100%, 1200px);
                align-items: stretch;
            }
            .reflection-demo-list {
                width: 250px;
                height: 930px;
                min-height: 320px;
            }
            .reflection-demo-info {
                display: grid;
                grid-template-rows: auto minmax(0, 1fr);
                gap: 10px;
                min-width: 0;
            }
            .reflection-demo-summary {
                box-sizing: border-box;
                min-height: 90px;
                padding: 10px;
                border: 1px solid #d0d7de;
                background: #ffffff;
            }
            .reflection-demo-summary h2 {
                margin: 0 0 6px 0;
                font-size: 18px;
            }
            .reflection-demo-summary p {
                margin: 0;
            }
            .reflection-demo-output {
                box-sizing: border-box;
                min-height: 420px;
                margin: 0;
                padding: 12px;
                overflow: auto;
                border: 1px solid #d0d7de;
                background: #f0f3f6;
                white-space: pre;
            }
            @media (max-width: 760px) {
                .reflection-demo-layout {
                    grid-template-columns: minmax(0, 1fr);
                }
                .reflection-demo-list {
                    height: 240px;
                }
            }
        </style>
        
        <div class="html-code">
            <div class="reflection-demo-layout">
                <div id="ReflectionClassList" class="reflection-demo-list"></div>
                <div class="reflection-demo-info">
                    <section class="reflection-demo-summary">
                        <h2 id="ReflectionClassTitle"></h2>
                        <p id="ReflectionClassDescription"></p>
                    </section>
                    <pre id="ReflectionOutput" class="reflection-demo-output"></pre>
                </div>
            </div>
        </div>
        
        <script class="js-code">
            tp.Ready(function () {
                var Classes = [
                    { Name: "tp.Object", Type: tp.Object, Description: "Base class for Tripous objects and custom Tripous event handling." },
                    { Name: "tp.Component", Type: tp.Component, Description: "HTML element wrapper with lifecycle, create params, data-setup support, child components, sizing, focus, and DOM helpers." },
                    { Name: "tp.WebFormContext", Type: tp.WebFormContext, Description: "Context object for WebDesk form creation, hosting mode, parent control, server packet, result data, and dynamic assets." },
                    { Name: "tp.WebForm", Type: tp.WebForm, Description: "Base component class for WebDesk forms with context, AppForm-like setup, initialization, loading, and closing hooks." },
                    { Name: "tp.Control", Type: tp.Control, Description: "Data-bindable component base class for controls. Adds data source, data field, required, read-only, and validation hooks." },
                    { Name: "tp.InputControl", Type: tp.InputControl, Description: "Base class for simple input controls with input/change handling and simple data binding." },
                    { Name: "tp.Label", Type: tp.Label, Description: "Label control wrapping a label element." },
                    { Name: "tp.TextBox", Type: tp.TextBox, Description: "Single-line text input control." },
                    { Name: "tp.NumberBox", Type: tp.NumberBox, Description: "Text input control for numeric values with decimal formatting and parsing." },
                    { Name: "tp.HtmlNumberBox", Type: tp.HtmlNumberBox, Description: "Native HTML number input control with Min, Max, Step, and Value properties." },
                    { Name: "tp.HtmlNumberBoxEx", Type: tp.HtmlNumberBoxEx, Description: "Native HTML number input wrapped with plus and minus step buttons." },
                    { Name: "tp.ValueSlider", Type: tp.ValueSlider, Description: "Native HTML range input used as a numeric slider or as a ValueList selector." },
                    { Name: "tp.ProgressBar", Type: tp.ProgressBar, Description: "Native HTML progress control with Max and Value properties." },
                    { Name: "tp.CalendarBox", Type: tp.CalendarBox, Description: "Table-based calendar control with date selection and month/year navigation." },
                    { Name: "tp.DateBox", Type: tp.DateBox, Description: "Text date input with a drop-down CalendarBox selector." },
                    { Name: "tp.HtmlDateBox", Type: tp.HtmlDateBox, Description: "Native HTML date input control with Date, Min, Max, and Step properties." },
                    { Name: "tp.Memo", Type: tp.Memo, Description: "Multi-line text input control based on textarea." },
                    { Name: "tp.CheckBox", Type: tp.CheckBox, Description: "Check box control with wrapping label text." },
                    { Name: "tp.ListControl", Type: tp.ListControl, Description: "Base class for virtual-scroller based list controls and list data binding." },
                    { Name: "tp.ListBox", Type: tp.ListBox, Description: "Virtual-scroller based list box control." },
                    { Name: "tp.ComboBox", Type: tp.ComboBox, Description: "Virtual-scroller based combo box with list-only and editable modes." },
                    { Name: "tp.CheckListControl", Type: tp.CheckListControl, Description: "Base class for multi-select check-list controls." },
                    { Name: "tp.CheckListBox", Type: tp.CheckListBox, Description: "Virtual-scroller based multi-select list box with check boxes." },
                    { Name: "tp.CheckComboBox", Type: tp.CheckComboBox, Description: "Virtual-scroller based multi-select combo box with check boxes and selected item labels." },
                    { Name: "tp.RadioGroup", Type: tp.RadioGroup, Description: "Radio-button group control with list-style selected index and selected value support." },
                    { Name: "tp.HtmlComboBox", Type: tp.HtmlComboBox, Description: "Native select element wrapped as a Tripous combo box." },
                    { Name: "tp.HtmlListBox", Type: tp.HtmlListBox, Description: "Native select element wrapped as a Tripous list box." },
                    { Name: "tp.ImageBox", Type: tp.ImageBox, Description: "Div-based image control using CSS background image modes." },
                    { Name: "tp.TreeNode", Type: tp.TreeNode, Description: "Tree node object used by tp.TreeView for hierarchy, text, URL, icon, and child node operations." },
                    { Name: "tp.TreeView", Type: tp.TreeView, Description: "Tree control composed of tp.TreeNode objects with expand, collapse, add, remove, and node click events." },
                    { Name: "tp.StatusBar", Type: tp.StatusBar, Description: "Shell status bar component with named items, text alignment, create params, data-setup support, and public update methods." },
                    { Name: "tp.Row", Type: tp.Row, Description: "Responsive row that listens to its own size and propagates size mode changes." },
                    { Name: "tp.Col", Type: tp.Col, Description: "Responsive column with width percentages per size mode." },
                    { Name: "tp.CtrlRow", Type: tp.CtrlRow, Description: "Form row with label, required mark, and one hosted control." },
                    { Name: "tp.CheckBoxRow", Type: tp.CheckBoxRow, Description: "Form row specialized for a check box and long wrapping text." },
                    { Name: "tp.VirtualScroller", Type: tp.VirtualScroller, Description: "Fixed-height row virtual scroller helper used by list controls and autocomplete." },
                    { Name: "tp.DropDownBox", Type: tp.DropDownBox, Description: "Resizable fixed-position drop-down box associated with another element." },
                    { Name: "tp.DataColumn", Type: tp.DataColumn, Description: "Client-side data column metadata with formatting and parsing support." },
                    { Name: "tp.DataRow", Type: tp.DataRow, Description: "Client-side data row carrying row state and item-array data." },
                    { Name: "tp.DataTable", Type: tp.DataTable, Description: "Client-side data table with columns, rows, and serialization contract support." },
                    { Name: "tp.DataSet", Type: tp.DataSet, Description: "Client-side data set containing related data tables." },
                    { Name: "tp.DataModule", Type: tp.DataModule, Description: "Client-side proxy for a server-side Tripous data module." },
                    { Name: "tp.DataSource", Type: tp.DataSource, Description: "Data-binding source over a data table, with position, sorting, filtering, and listeners." }
                ].filter(function (Item) {
                    return tp.IsFunction(Item.Type);
                });
        
                var ClassList = new tp.ListBox({
                    ElementOrSelector: "#ReflectionClassList",
                    List: Classes,
                    ListDisplayField: "Name",
                    SelectedIndex: 0
                });
        
                var GetClassNameByPrototype = function (Prototype) {
                    var Item = Classes.find(function (ClassInfo) {
                        return ClassInfo.Type.prototype === Prototype;
                    });
                    if (Item)
                        return Item.Name;
                    return Prototype.constructor && Prototype.constructor.name ? Prototype.constructor.name : "(prototype)";
                };
        
                var IsPseudoPrivate = function (Name) {
                    return /^f[A-Z]/.test(Name);
                };
        
                var GetOwnerName = function (Prototype, Name) {
                    var Current = Prototype;
                    while (Current && Current !== Object.prototype) {
                        if (Object.prototype.hasOwnProperty.call(Current, Name))
                            return GetClassNameByPrototype(Current);
                        Current = Object.getPrototypeOf(Current);
                    }
                    return "";
                };
        
                var FormatProperty = function (Info, Owner) {
                    var Flags = [];
                    if (Info.HasGetter)
                        Flags.push("get");
                    if (Info.HasSetter)
                        Flags.push("set");
                    if (Info.IsWritable)
                        Flags.push("writable");
                    if (Info.IsEnumerable)
                        Flags.push("enumerable");
                    return Info.Name + (Flags.length > 0 ? " [" + Flags.join(", ") + "]" : "") + (Owner ? " <" + Owner + ">" : "");
                };
        
                var FormatMethod = function (Info, Owner) {
                    return Info.Signature + (Owner ? " <" + Owner + ">" : "");
                };
        
                var GetPrototypeChain = function (Prototype) {
                    var Result = [];
                    var Current = Prototype;
                    while (Current && Current !== Object.prototype) {
                        Result.push(GetClassNameByPrototype(Current));
                        Current = Object.getPrototypeOf(Current);
                    }
                    return Result;
                };
        
                var GetMemberList = function (Value, ExcludedNames) {
                    return tp.GetPropertyInfoList(Value).filter(function (Info) {
                        return Info.Name !== "__proto__"
                            && ExcludedNames.indexOf(Info.Name) === -1
                            && !IsPseudoPrivate(Info.Name);
                    });
                };
        
                var RenderClass = function (Item) {
                    var Prototype = Item.Type.prototype;
                    var ObjectNames = Object.getOwnPropertyNames(Object.prototype);
                    var FunctionNames = Object.getOwnPropertyNames(Function.prototype).concat(["length", "name", "prototype", "arguments", "caller"]);
                    var List = GetMemberList(Prototype, ObjectNames);
                    var StaticList = GetMemberList(Item.Type, FunctionNames.concat(ObjectNames));
                    var Constructor = List.filter(function (Info) { return Info.IsConstructor; });
                    var Props = List.filter(function (Info) { return Info.IsProperty; });
                    var Methods = List.filter(function (Info) { return Info.IsFunction && !Info.IsConstructor; });
                    var StaticProps = StaticList.filter(function (Info) { return Info.IsProperty; });
                    var StaticMethods = StaticList.filter(function (Info) { return Info.IsFunction && !Info.IsConstructor; });
                    var Lines = [];
        
                    Props.sort(function (A, B) { return A.Name.localeCompare(B.Name); });
                    Methods.sort(function (A, B) { return A.Name.localeCompare(B.Name); });
                    StaticProps.sort(function (A, B) { return A.Name.localeCompare(B.Name); });
                    StaticMethods.sort(function (A, B) { return A.Name.localeCompare(B.Name); });
        
                    tp.Text("#ReflectionClassTitle", Item.Name);
                    tp.Text("#ReflectionClassDescription", Item.Description);
        
                    Lines.push(Item.Name);
                    Lines.push("prototype chain: " + GetPrototypeChain(Prototype).join(" -> "));
                    Lines.push("");
        
                    if (Constructor.length > 0) {
                        Lines.push("constructor");
                        Constructor.forEach(function (Info) {
                            Lines.push("  " + Info.Signature);
                        });
                        Lines.push("");
                    }
        
                    Lines.push("properties (" + Props.length + ")");
                    Props.forEach(function (Info) {
                        Lines.push("  " + FormatProperty(Info, GetOwnerName(Prototype, Info.Name)));
                    });
                    Lines.push("");
        
                    Lines.push("methods (" + Methods.length + ")");
                    Methods.forEach(function (Info) {
                        Lines.push("  " + FormatMethod(Info, GetOwnerName(Prototype, Info.Name)));
                    });
        
                    if (StaticProps.length > 0 || StaticMethods.length > 0) {
                        Lines.push("");
                        Lines.push("static properties (" + StaticProps.length + ")");
                        StaticProps.forEach(function (Info) {
                            Lines.push("  " + FormatProperty(Info, ""));
                        });
                        Lines.push("");
                        Lines.push("static methods (" + StaticMethods.length + ")");
                        StaticMethods.forEach(function (Info) {
                            Lines.push("  " + FormatMethod(Info, ""));
                        });
                    }
        
                    tp.Text("#ReflectionOutput", Lines.join("\n"));
                };
        
                ClassList.On("SelectedIndexChanged", function () {
                    if (ClassList.SelectedItem)
                        RenderClass(ClassList.SelectedItem);
                });
        
                RenderClass(Classes[0]);
            });
        </script>
    </main>

    <section id="DemoSourcePanel" class="demo-source-panel" hidden>
        <div class="demo-source-tabs">
            <button type="button" data-demo-source-tab="html">HTML</button>
            <button type="button" data-demo-source-tab="javascript">JavaScript</button>
        </div>
        <div class="demo-source-page" data-demo-source-page="html">
            <pre id="DemoHtmlEditor"></pre>
        </div>
        <div class="demo-source-page" data-demo-source-page="javascript">
            <pre id="DemoJavaScriptEditor"></pre>
        </div>
    </section>
</body>
</html>
