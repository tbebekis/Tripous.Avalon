<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tp.FrameBox</title>
    <link rel="stylesheet" href="../tripous/css/tp-Variables.css">
    <link rel="stylesheet" href="../tripous/css/tp.css">
    <link rel="stylesheet" href="../tripous/css/font-awesome.css">
    <link rel="stylesheet" href="../tripous/css/glyphicons.css">
    <link rel="stylesheet" href="../tripous/css/tp-UI.css">
    <link rel="stylesheet" href="../assets/css/demos.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.2/ace.js"></script>
    <script src="../tripous/js/tp.js"></script>
    <script src="../tripous/js/tp-Data.js"></script>
    <script src="../tripous/js/tp-UI.js"></script>
    <script src="../assets/js/demos.js"></script>
</head>
<body class="demo-page">
    <script>
        if (window.top !== window.self) {
            document.body.classList.add("is-embedded");
        }
        Demos.RegisterSourcePreview();
    </script>

    <main class="demo-body">
        <p class="demo-index-link">
            <a href="../index.html">Tripous Web Demos</a>
        </p>
        <h1>tp.FrameBox</h1>
        
        <p>
            The <code>tp.FrameBox</code> helper displays a modal window with an iframe element. The content can be a URL or HTML markup.
        </p>
        
        <style>
            .frame-box-demo-actions {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                align-items: center;
                margin-bottom: 12px;
            }
            .frame-box-demo-url {
                box-sizing: border-box;
                width: min(100%, 520px);
                padding: 6px 8px;
                border: 1px solid #d0d7de;
            }
            .frame-box-demo-content {
                box-sizing: border-box;
                width: min(100%, 760px);
                min-height: 150px;
                margin-bottom: 12px;
                padding: 10px;
                border: 1px solid #d0d7de;
                resize: vertical;
            }
            .frame-box-demo-log {
                box-sizing: border-box;
                width: min(100%, 760px);
                min-height: 90px;
                padding: 12px;
                overflow: auto;
                border: 1px solid #d0d7de;
                background: #f0f3f6;
            }
        </style>
        
        <div class="html-code">
            <div class="frame-box-demo-actions">
                <button id="FrameUrlButton" type="button">Display URL</button>
                <input id="FrameUrlInput" class="frame-box-demo-url" type="text" value="https://www.w3.org/DOM/" />
            </div>
        
            <textarea id="FrameContentInput" class="frame-box-demo-content"><!doctype html>
        <html>
        <body style="font-family: sans-serif; line-height: 1.5;">
            <h1>HTMLIFrameElement</h1>
            <p>
                The HTMLIFrameElement interface provides special properties and methods for manipulating
                the layout and presentation of inline frame elements.
            </p>
            <button type="button">Hi there</button>
            <input type="text" value="text" />
        </body>
        </html></textarea>
        
            <div class="frame-box-demo-actions">
                <button id="FrameContentButton" type="button">Display HTML Content</button>
            </div>
        
            <pre id="FrameBoxOutput" class="frame-box-demo-log"></pre>
        </div>
        
        <script class="js-code">
            tp.Ready(function () {
                var Counter = 0;
        
                var WriteLog = function (Message) {
                    Counter++;
                    tp.Text("#FrameBoxOutput", "#" + Counter + " " + Message + "\n" + "time = " + new Date().toLocaleTimeString());
                };
        
                tp.On("#FrameUrlButton", "click", async function () {
                    var Url = tp.Value("#FrameUrlInput");
                    var Dialog = await tp.FrameBoxAsync(Url, {
                        Width: 600,
                        Height: 450,
                        Text: "Display URL in an iframe"
                    });
                    WriteLog("URL frame box closed with result " + Dialog.DialogResult + ".");
                    tp.InfoNote("Frame box closed.");
                });
        
                tp.On("#FrameContentButton", "click", async function () {
                    var Content = tp.Value("#FrameContentInput");
                    var Dialog = await tp.FrameBoxAsync(Content, {
                        Width: 600,
                        Height: 450,
                        Text: "Display HTML content in an iframe"
                    });
                    WriteLog("HTML content frame box closed with result " + Dialog.DialogResult + ".");
                    tp.InfoNote("Frame box closed.");
                });
        
                WriteLog("Ready.");
            });
        </script>
    </main>

    <section id="DemoSourcePanel" class="demo-source-panel" hidden>
        <div class="demo-source-tabs">
            <button type="button" data-demo-source-tab="html">HTML</button>
            <button type="button" data-demo-source-tab="javascript">JavaScript</button>
        </div>
        <div class="demo-source-page" data-demo-source-page="html">
            <pre id="DemoHtmlEditor"></pre>
        </div>
        <div class="demo-source-page" data-demo-source-page="javascript">
            <pre id="DemoJavaScriptEditor"></pre>
        </div>
    </section>
</body>
</html>
