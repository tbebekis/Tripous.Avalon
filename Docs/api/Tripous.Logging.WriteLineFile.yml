  example: []
  syntax:
    content: public WriteLineFile(string Folder = "", string DefaultFileName = "", string ColumnLine = "", int MaxSizeKiloBytes = 512)
    parameters:
    - id: Folder
      type: System.String
      description: The folder where files are placed.
    - id: DefaultFileName
      type: System.String
      description: >-
        A file name to be used as template file name. 
            A date-time value is added in front of each new file name, i.e.<code>yyyy-MM-dd_HH_mm_ss__fff_DefaultFileName</code>
    - id: ColumnLine
      type: System.String
      description: >-
        The first line of a file may contain column names, as passed by this parameter. 
            Column names must be right padded with spaces according to a used line format.
    - id: MaxSizeKiloBytes
      type: System.Int32
      description: A file may grow up to a defined maximum size (in kilobytes). After that a new file is created.
