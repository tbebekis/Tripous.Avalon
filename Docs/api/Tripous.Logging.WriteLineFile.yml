  assemblies:
  - Tripous.Logging
  namespace: Tripous.Logging
  summary: >-
    Helper used in writing to files, line by line.


    <p>It uses the fist line of a file as a column line, if one is passed.</p>

    <p>Column names must be right padded with spaces according to a used line format.</p>

    <p>A file may grow up to a defined maximum size (in kilobytes). </p>

    <p>After that a new file is created.</p>

    <p>The new file gets a name as <code>yyyy-MM-dd_HH_mm_ss__fff_DefaultFileName</code></p>

    <p></p>
