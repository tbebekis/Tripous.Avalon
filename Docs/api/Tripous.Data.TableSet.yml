    id: CommitBatch
    path: ../Tripous.Data/TableSet.cs
    startLine: 581
  assemblies:
  - Tripous.Data
  namespace: Tripous.Data
  summary: >-
    A Commit() version for batch operations.


    <p>Starts a transaction and keeps on calling <xref href="Tripous.Data.BatchCommitArgs.BeforeFunc" data-throw-if-not-resolved="false"></xref> while <xref href="Tripous.Data.BatchCommitArgs.AfterFunc" data-throw-if-not-resolved="false"></xref>  returns true.</p>

    <p>Commits the transaction each time the <xref href="Tripous.Data.BatchCommitArgs.TransLimit" data-throw-if-not-resolved="false"></xref> is reached.</p>

    <p>NOTE: <xref href="Tripous.Data.BatchCommitArgs.BeforeFunc" data-throw-if-not-resolved="false"></xref> and <xref href="Tripous.Data.BatchCommitArgs.AfterFunc" data-throw-if-not-resolved="false"></xref> are optional.</p>
  example: []
  syntax:
    content: public void CommitBatch(BatchCommitArgs Args)
    parameters:
    - id: Args
      type: Tripous.Data.BatchCommitArgs
    content.vb: Public Sub CommitBatch(Args As BatchCommitArgs)
  overload: Tripous.Data.TableSet.CommitBatch*
