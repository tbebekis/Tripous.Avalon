  assemblies:
  - Tripous.Data
  namespace: Tripous.Data
  summary: >-
    Generates Sql statements for the Table.


    <p></p>

    <p><b>WARNING:</b> The module name and the table name are used in constructing a unique StatementName.</p>

    <p>The StatementName is used with the <xref href="Tripous.Data.SqlStore.GetNativeSchemaFromTableName(System.String%2cSystem.String)" data-throw-if-not-resolved="false"></xref>

    so the <code>ModuleName.TableName</code> must construct a unique name because schema DataTables are stored in the <xref href="Tripous.Data.SqlCache" data-throw-if-not-resolved="false"></xref> under that unique name. </p>
