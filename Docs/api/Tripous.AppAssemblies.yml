    id: FindApplicationClassType
    path: ../Tripous/AppAssemblies.cs
    startLine: 141
  assemblies:
  - Tripous
  namespace: Tripous
  summary: >-
    Searches all application assemblies for a class type.


    The search is performed first using the fully qualified type name.

    If not found, a second search is performed using only the class name.


    When <code class="paramref">BaseType</code> is specified, only types assignable

    to that base type are considered.
  example: []
  syntax:
    content: public static Type FindApplicationClassType(string ClassName, Type BaseType = null)
    parameters:
    - id: ClassName
      type: System.String
    - id: BaseType
      type: System.Type
    return:
      type: System.Type
    content.vb: Public Shared Function FindApplicationClassType(ClassName As String, BaseType As Type = Nothing) As Type
  overload: Tripous.AppAssemblies.FindApplicationClassType*
