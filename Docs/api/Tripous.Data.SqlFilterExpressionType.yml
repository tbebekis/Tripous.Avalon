    startLine: 50
  assemblies:
  - Tripous.Data
  namespace: Tripous.Data
  summary: >-
    A filter with a lookup SELECT Sql. The user must define the LookUp Sql in the design-time UI.


    <p>The lookup SELECT is executed by the runtime UI and it returns one or more rows.</p>

    <p>The first column of the returned result list, is the Result Column, and it is used as the value in the runtime UI.</p>

    <p>The user must choose one or more rows in the runtime UI.</p>

    <p>[[lookup:Label]] - single choise</p>

    <p> [[lookup:multi:Label]] - multi choise</p>
  example: []
  syntax:
    content: Lookup = 4
    return:
      type: Tripous.Data.SqlFilterExpressionType
