  - Tripous.Data
  namespace: Tripous.Data
  summary: >-
    A date filter.


    <p>[[date:Label]] or [[date:custom:Label]] is a Custom date. The user must enter the date in the runtime UI.</p>

    <p>[[date:LastMonth:Label]] is a computed date. The system computes the date in the runtime UI.</p>

    <p>The <xref href="Tripous.DateRange" data-throw-if-not-resolved="false"></xref> enumeration type contains the valid literals for this setting.</p>
  example: []
  syntax:
    content: Date = 1
    return:
      type: Tripous.Data.SqlFilterExpressionType
