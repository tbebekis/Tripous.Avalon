  assemblies:
  - Tripous.Data
  namespace: Tripous.Data
  summary: Assigns the locator key and field values from a source row to a target row.
  example: []
  syntax:
    content: public virtual void Assign(DataRow SourceRow, DataRow TargetRow, string KeyFieldName, Dictionary<string, string> TargetFieldMap)
    parameters:
    - id: SourceRow
      type: System.Data.DataRow
      description: The row to get values from. When is null, then the key field and mapped target fields are cleared.
    - id: TargetRow
      type: System.Data.DataRow
      description: The row to set values to.
    - id: KeyFieldName
      type: System.String
      description: Identifies the target field that receives the locator key.
    - id: TargetFieldMap
      type: System.Collections.Generic.Dictionary{System.String,System.String}
      description: >-
        maps locator source field names or aliases to fields in the target row.

            <p>The mapping is supplied by the binding layer because only the binding knows the target table, join and aliases used in its current context. This allows the same locator definition to be reused safely by different controls, grids and modules.</p>
            <p>The target field map takes precedence over <xref href="Tripous.Data.LocatorFieldDef.TargetField" data-throw-if-not-resolved="false"></xref>.</p>
    content.vb: Public Overridable Sub Assign(SourceRow As DataRow, TargetRow As DataRow, KeyFieldName As String, TargetFieldMap As Dictionary(Of String, String))
