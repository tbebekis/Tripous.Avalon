    path: ../Tripous.Logging/Logger.cs
    startLine: 364
  assemblies:
  - Tripous.Logging
  namespace: Tripous.Logging
  summary: >-
    Formats the specified params into a placeholder containing text. It also returns a dictionary of the specified params for use by structured log listeners.


    <example>The specified text may contain placeholders. Placeholders are replaced based in their order, NOT in their content. 

    The content of a placeholder becomes a key in the returned dictionary.


    <pre><code class="lang-csharp">string Text = "Customer {CustomerId} order {OrderId} is completed.";

    var ParamsDictionary = FormatParams(ref Text, new { CustomerId = 123, OrderId = 456 });</code></pre>

    </example>
  example: []
  syntax:
    content: public static string FormatParams(string Text, Dictionary<string, object> Params)
    parameters:
    - id: Text
      type: System.String
    - id: Params
      type: System.Collections.Generic.Dictionary{System.String,System.Object}
    return:
      type: System.String
    content.vb: Public Shared Function FormatParams(Text As String, Params As Dictionary(Of String, Object)) As String
  overload: Tripous.Logging.Logger.FormatParams*
