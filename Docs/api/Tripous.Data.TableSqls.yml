  summary: >-
    To be used with <xref href="Tripous.Data.TableSqls.SelectSql" data-throw-if-not-resolved="false"></xref>

    <p>A string list, where each string  has the format FIELD_NAME=TitleKey.</p> 

    <p>Determines the visibility of the fields in the drop-down grids: 

    if it is empty then all fields are visible  

    else only the included fields are visible  

    </p>
