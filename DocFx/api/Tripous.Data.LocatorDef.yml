  assemblies:
  - Tripous.Data
  namespace: Tripous.Data
  summary: >-
    Describes a <xref href="Tripous.Data.Locator" data-throw-if-not-resolved="false"></xref>, i.e. a searchable selector for large reference tables.


    <p>A locator represents (returns) a single value from the source <xref href="Tripous.Data.LocatorDef.SourceTableName" data-throw-if-not-resolved="false"></xref>, but it can handle and display multiple values

    in order to help the end user in identifying and locating that single value.</p>

    <p>For example, a TRADES target data table has a CUSTOMER_ID column, representing that single value, but the user interface

    has to display information from the CUSTOMERS source table, specifically, the ID, CODE and NAME columns.</p>

    <p>The TRADES table is the <b>target data table</b> and the CUSTOMER_ID is the <b>target field name</b>.</p>

    <p>The CUSTOMERS source table is the <xref href="Tripous.Data.LocatorDef.SourceTableName" data-throw-if-not-resolved="false"></xref> and the ID is the source <xref href="Tripous.Data.LocatorDef.KeyField" data-throw-if-not-resolved="false"></xref> field name.</p>

    <p>The fields, ID, CODE and NAME, may be described by individual <xref href="Tripous.Data.LocatorFieldDef" data-throw-if-not-resolved="false"></xref> field items.</p>

    <p>A locator can be used either as a single-row control, i.e. as a locator control, or as a group of

    related columns in a Grid.</p>

    <p>NOTE: A locator of a locator control type, may or may not define the <xref href="Tripous.Data.LocatorFieldDef.TargetField" data-throw-if-not-resolved="false"></xref> 

    field names. Usually in a case like that, the target data table contains just the target key field, the field the locator control is bound to.  </p>

    <p>A locator of a grid-type must define the names of those target fields always and the target data table must contain DataColumn columns

    of those fields.</p>
