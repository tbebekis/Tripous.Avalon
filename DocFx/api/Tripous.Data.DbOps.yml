  assemblies:
  - Tripous.Data
  namespace: Tripous.Data
  summary: >-
    A helper class that post changes, i.e. INSERT-UPDATE-DELETE, of a single <xref href="Tripous.Data.MemTable" data-throw-if-not-resolved="false"></xref> table or a table tree to the database.


    <p>All tables should have the <code>InsertRowSql</code> and the <code>UpdateRowSql</code> of their <xref href="Tripous.Data.MemTable.Sqls" data-throw-if-not-resolved="false"></xref> defined. </p>

    <p>WARNING: Only DataRows that have the <code>Added</code>, <code>Modified</code> or <code>Deleted</code> <xref href="System.Data.DataRowState" data-throw-if-not-resolved="false"></xref> defined are processed. </p>
