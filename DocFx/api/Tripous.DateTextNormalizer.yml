    startLine: 16
  assemblies:
  - Tripous
  namespace: Tripous
  summary: >-
    Normalizes and parses date text using ISO format and culture short-date format.


    <p>ISO-like input is detected when the text contains a dash or starts with a four-digit part.</p>

    <p>Examples: <code>2030</code> becomes <code>2030-01-01</code>, <code>2030-03</code> becomes <code>2030-03-01</code>, and <code>2030-03-10</code> remains <code>2030-03-10</code>.</p>

    <p>Culture input follows <xref href="System.Globalization.DateTimeFormatInfo.ShortDatePattern" data-throw-if-not-resolved="false"></xref>. For a DMY culture, <code>10/3</code> becomes <code>10/03/current-year</code> and <code>10/3/30</code> becomes <code>10/03/2030</code>.</p>
  example: []
