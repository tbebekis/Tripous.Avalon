    id: DeleteRows
    path: ../Tripous.Data/Extensions/DataTableExtensions.cs
    startLine: 84
  assemblies:
  - Tripous.Data
  namespace: Tripous.Data
  summary: >-
    A DataRow is marked as Deleted only if the DataRow.Delete() is called.


    <p>The DataRowCollection.Clear(), DataRowCollection.RemoveAt(), DataTable.Clear() etc, 

    do NOT set the DataRowState.Deleted flag.</p>

    <p>This method deletes all rows from a DataTable and sets the Deleted flag.</p>

    <p>WARNING: Only DataRowState.Unchanged rows (which is set by a DataTable.AcceptChanges() etc)

    are marked as DataRowState.Deleted.</p>
  example: []
  syntax:
    content: public static void DeleteRows(this DataTable Table)
    parameters:
    - id: Table
      type: System.Data.DataTable
    content.vb: Public Shared Sub DeleteRows(Table As DataTable)
  overload: Tripous.Data.DataTableExtensions.DeleteRows*
