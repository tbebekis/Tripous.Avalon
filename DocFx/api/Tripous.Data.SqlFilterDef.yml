  assemblies:
  - Tripous.Data
  namespace: Tripous.Data
  summary: >-
    Describes a filter applied to a Field.


    <p>The field could be a <xref href="System.Data.DataColumn" data-throw-if-not-resolved="false"></xref> in a <xref href="System.Data.DataView" data-throw-if-not-resolved="false"></xref> or a field in a <code>SELECT</code> statement text.</p>

    <p>It can be used to construct the <xref href="System.Data.DataView.RowFilter" data-throw-if-not-resolved="false"></xref> or to construct the <code>WHERE</code> clause of a <code>SELECT</code> statement. </p>
