  assemblies:
  - Tripous.Logging
  namespace: Tripous.Logging
  summary: >-
    A log listener that synchronizes the <xref href="Tripous.Logging.SyncedLogListener.ProcessLog(Tripous.Logging.LogEntry)" data-throw-if-not-resolved="false"></xref> call to any context.


    <p>That is, it is safe to attach to the <xref href="Tripous.Logging.SyncedLogListener.EntryEvent" data-throw-if-not-resolved="false"></xref> a GUI element such as a Form or a TextBox.</p>

    <p>SEE: <xref href="System.Threading.SynchronizationContext.Post(System.Threading.SendOrPostCallback%2cSystem.Object)" data-throw-if-not-resolved="false"></xref> which reverses the responsibility of thread synchronization. </p>

    <p>Client code has just to link to <xref href="Tripous.Logging.SyncedLogListener.EntryEvent" data-throw-if-not-resolved="false"></xref> and then process the passed <xref href="Tripous.Logging.LogEntry" data-throw-if-not-resolved="false"></xref> safely.</p>

    <p>The <xref href="Tripous.Logging.LogEntry" data-throw-if-not-resolved="false"></xref> provides methods such as <xref href="Tripous.Logging.LogEntry.AsJson" data-throw-if-not-resolved="false"></xref>, <xref href="Tripous.Logging.LogEntry.AsList" data-throw-if-not-resolved="false"></xref>, etc. 

    for getting a string representation of the entry.</p>

    <p>SEE: https://lostechies.com/gabrielschenker/2009/01/23/synchronizing-calls-to-the-ui-in-a-multi-threaded-application/</p>
  example: []
  syntax:
    content: 'public class SyncedLogListener : LogListener'
    content.vb: Public Class SyncedLogListener Inherits LogListener
