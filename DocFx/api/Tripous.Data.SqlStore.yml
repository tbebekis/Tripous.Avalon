  assemblies:
  - Tripous.Data
  namespace: Tripous.Data
  summary: >-
    Sql store. Used in executing SELECT, INSERT, UPDATE, DELETE, etc commands, using a DbConnection.


    <p>

    Many methods use a Params parameter.

    That Params can be: <br />

    a. either a comma separated list of parameters or <br />

    b. the Params[0] element, that is the first element in Params, may be 


    <ol><li>a <xref href="System.Data.DataRow" data-throw-if-not-resolved="false"></xref></li><li>a generic <xref href="System.Collections.IDictionary" data-throw-if-not-resolved="false"></xref>&lt;string, object&gt;</li><li>or an <xref href="System.Collections.IList" data-throw-if-not-resolved="false"></xref> or <xref href="System.Array" data-throw-if-not-resolved="false"></xref></li></ol>


    and in this second case no other Params elements are used

    </p>
