  summary: >-
    Creates a new table in the database by executing CommandText. Returns true

    only if creates the table, false if the table already exists.


    <p>The method creates a table generator too, if the database supports generators/sequences.</p>

    <p>CommandText should be a CREATE TABLE statement and can contain datatype placeholders.

    See <xref href="Tripous.Data.SqlProvider.ReplaceDataTypePlaceholders(System.String)" data-throw-if-not-resolved="false"></xref> for details.</p>
