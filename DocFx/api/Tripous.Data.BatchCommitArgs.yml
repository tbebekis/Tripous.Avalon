  assemblies:
  - Tripous.Data
  namespace: Tripous.Data
  summary: >-
    Constructor


    <p>BeforeFunc: Provided by caller. It is called before each iteration.</p>

    <p>AfterFunc: Provided by caller. It is called after each iteration.

    The whole batch operation terminates when AfterFunc() returns false</p>

    <p>TransLimit: The transaction is commited each time the TransLimit is reached</p>
  example: []
  syntax:
