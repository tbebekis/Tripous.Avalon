    startLine: 63
  assemblies:
  - Tripous.Data
  namespace: Tripous.Data
  summary: >-
    Optional. Provided by caller. It is called after each (post or no-post) and any iteration in the loop.


    <p>The TableSet passes the LastCommitedId to this method.</p>

    <p>The whole batch operation terminates when this call returns false.</p>

    <p>NOTE: If it is not provided, it is considered as returning true always.</p>
  example: []
  syntax:
    content: public Func<object, bool> AfterFunc { get; }
