  commentId: P:Tripous.Data.BatchCommitArgs.BeforeFunc
  id: BeforeFunc
  parent: Tripous.Data.BatchCommitArgs
  langs:
  - csharp
  - vb
  name: BeforeFunc
  nameWithType: BatchCommitArgs.BeforeFunc
  fullName: Tripous.Data.BatchCommitArgs.BeforeFunc
  type: Property
  source:
    remote:
      path: Tripous.Data/BatchCommitArgs.cs
      branch: main
      repo: https://github.com/tbebekis/Tripous.Avalon.git
    id: BeforeFunc
    path: ../Tripous.Data/BatchCommitArgs.cs
    startLine: 56
  assemblies:
  - Tripous.Data
  namespace: Tripous.Data
  summary: >-
    Optional. Provided by caller. It is called before each and any iteration in the loop.


    <p>If it returns true, then the TableSet/Broker posts the row and increases the PostCounter counter.</p>

    <p>The caller should return true, only when calls Broker.Insert() or Broker.Edit() (NO Broker.Delete()) from inside this method.

    Returning true is the sign that a row post is required.</p>

    <p>NOTE: If it is not provided, it is considered as returning true always.</p>
  example: []
  syntax:
    content: public Func<bool> BeforeFunc { get; }
    parameters: []
    return:
      type: System.Func{System.Boolean}
    content.vb: Public Property BeforeFunc As Func(Of Boolean)
  overload: Tripous.Data.BatchCommitArgs.BeforeFunc*
