    path: ../Tripous.Data/BatchCommitArgs.cs
    startLine: 48
  assemblies:
  - Tripous.Data
  namespace: Tripous.Data
  summary: >-
    It increases when an iteration posts a row. The BeforeFunc() should return true, for this to happen.


    <p>This is NOT the commit counter. It is the counter for the posts to the database

    and is used, along with the TransLimit, to decide if the Transaction.Commit() should be called.</p>

    <p>It is set by the TableSet, NOT the caller.</p>
  example: []
  syntax:
    content: public int PostCounter { get; set; }
    parameters: []
    return:
      type: System.Int32
    content.vb: Public Property PostCounter As Integer
  overload: Tripous.Data.BatchCommitArgs.PostCounter*
