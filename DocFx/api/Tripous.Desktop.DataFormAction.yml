    id: Cancel
    path: ../Tripous.Desktop/Enums/DataFormAction.cs
    startLine: 58
  assemblies:
  - Tripous.Desktop
  namespace: Tripous.Desktop
  summary: >-
    Cancel.


    <p>In a IsList form: Sets the modal result to Cancel.</p>

    <p>In a IsMaster form: When the form is in FormState.List then if the form is modal then it sets the modal result to Cancel. Else, if non-modal, then it closes the form. </p>

    <p>In a IsMaster form: When the form is in FormState.Insert | FormState.Edit then it cancels the edit operation.</p>
  example: []
  syntax:
    content: Cancel = 64
    return:
      type: Tripous.Desktop.DataFormAction
