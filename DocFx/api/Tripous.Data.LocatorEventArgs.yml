    id: SelectSql
    path: ../Tripous.Data/LocatorEventArgs.cs
    startLine: 50
  assemblies:
  - Tripous.Data
  namespace: Tripous.Data
  summary: >-
    The SELECT statement.


    <p>Used with the <xref href="Tripous.Data.LocatorEventType.AddToWhere" data-throw-if-not-resolved="false"></xref> type and the <xref href="Tripous.Data.LocatorEventType.SelectSourceTable" data-throw-if-not-resolved="false"></xref> only.</p>

    <p>With <xref href="Tripous.Data.LocatorEventType.AddToWhere" data-throw-if-not-resolved="false"></xref>, client code may add to <xref href="Tripous.Data.SelectSql.Where" data-throw-if-not-resolved="false"></xref>.</p>

    <p>With <xref href="Tripous.Data.LocatorEventType.SelectSourceTable" data-throw-if-not-resolved="false"></xref>, client code executes the statement as the following


    <pre><code class="lang-csharp">select * from ({SelectSql.Text}) X where {UserWhere}</code></pre>

    </p>
  example: []
  syntax:
    content: public SelectSql SelectSql { get; init; }
    parameters: []
    return:
      type: Tripous.Data.SelectSql
    content.vb: Public Property SelectSql As SelectSql
  overload: Tripous.Data.LocatorEventArgs.SelectSql*
