  assemblies:
  - Tripous.Data
  namespace: Tripous.Data
  summary: >-
    The class name of the <xref href="System.Type" data-throw-if-not-resolved="false"></xref> this descriptor describes.


    <p>NOTE: The value of this property may be a string returned by the <xref href="System.Type.AssemblyQualifiedName" data-throw-if-not-resolved="false"></xref> property of the type. </p>

    <p>In that case, it consists of the type name, including its namespace, followed by a comma, followed by the display name of the assembly

    the type belongs to. It might looks like the following</p>

    <p><code>Tripous.Data.DataModule, Tripous, Version=1.0.0.0, Culture=neutral, PublicKeyToken=null</code></p>

    <p>Otherwise it can be a full type name <xref href="System.Type.FullName" data-throw-if-not-resolved="false"></xref>, e.g. </p>

    <p><code>Tripous.Data.DataModule</code></p>
