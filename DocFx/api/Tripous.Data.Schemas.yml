  assemblies:
  - Tripous.Data
  namespace: Tripous.Data
  summary: >-
    The registry of database schemas.


    <p>A <xref href="Tripous.Data.Schema" data-throw-if-not-resolved="false"></xref> has a unique domain name and a connection name. </p>

    <p>The <xref href="Tripous.Data.Schema.Domain" data-throw-if-not-resolved="false"></xref> could be System, Application, or the unique identifier name of an external plugin. </p>

    <p>The <xref href="Tripous.Data.Schema.ConnectionName" data-throw-if-not-resolved="false"></xref> connection name, used in creating the relevant <xref href="Tripous.Data.SqlStore" data-throw-if-not-resolved="false"></xref> instance that executes the schema.</p>

    <p>A <xref href="Tripous.Data.Schema" data-throw-if-not-resolved="false"></xref> has also a list of <xref href="Tripous.Data.SchemaVersion" data-throw-if-not-resolved="false"></xref> items. </p>

    <p>A <xref href="Tripous.Data.SchemaVersion" data-throw-if-not-resolved="false"></xref> item has an integer version,  

    and collections of <xref href="Tripous.Data.SchemaItem" data-throw-if-not-resolved="false"></xref> items for tables and views,

    along with collections of statements to be executed before and after the schema version is executed.</p>
