    id: StringOf
    path: ../Tripous/Extensions/StreamExtensions.cs
    startLine: 159
  assemblies:
  - Tripous
  namespace: Tripous
  summary: >-
    Decodes Buffer into a string. Buffer must be in SourceEncoding.


    <p>If SourceEncoding is null then a preamble is used, if any, else Encoding.UTF8 is assumed.</p>

    <p>If DestEncoding is not null then Buffer is first converted to that Encoding</p>
  example: []
  syntax:
    content: public static string StringOf(byte[] Buffer, Encoding SourceEncoding = null, Encoding DestEncoding = null)
    parameters:
    - id: Buffer
      type: System.Byte[]
    - id: SourceEncoding
      type: System.Text.Encoding
    - id: DestEncoding
      type: System.Text.Encoding
    return:
      type: System.String
    content.vb: Public Shared Function StringOf(Buffer As Byte(), SourceEncoding As Encoding = Nothing, DestEncoding As Encoding = Nothing) As String
  overload: Tripous.StreamExtensions.StringOf*
  nameWithType.vb: StreamExtensions.StringOf(Byte(), Encoding, Encoding)
  fullName.vb: Tripous.StreamExtensions.StringOf(Byte(), System.Text.Encoding, System.Text.Encoding)
