    id: BytesOf
    path: ../Tripous/Extensions/StreamExtensions.cs
    startLine: 136
  assemblies:
  - Tripous
  namespace: Tripous
  summary: >-
    Encodes Text into a byte array. Text must be in SourceEncoding. 


    <p>If SourceEncoding is null then Encoding.UTF8 is assumed.</p>

    <p>If DestEncoding is not null then the result byte array is converted to that Encoding. </p>

    <p>If PutPreamble is true then a preamble is put in front of the result array</p>
  example: []
  syntax:
    content: public static byte[] BytesOf(string Text, Encoding SourceEncoding = null, Encoding DestEncoding = null, bool PutPreamble = false)
    parameters:
    - id: Text
      type: System.String
    - id: SourceEncoding
      type: System.Text.Encoding
    - id: DestEncoding
      type: System.Text.Encoding
    - id: PutPreamble
      type: System.Boolean
    return:
      type: System.Byte[]
    content.vb: Public Shared Function BytesOf(Text As String, SourceEncoding As Encoding = Nothing, DestEncoding As Encoding = Nothing, PutPreamble As Boolean = False) As Byte()
  overload: Tripous.StreamExtensions.BytesOf*
  nameWithType.vb: StreamExtensions.BytesOf(String, Encoding, Encoding, Boolean)
  fullName.vb: Tripous.StreamExtensions.BytesOf(String, System.Text.Encoding, System.Text.Encoding, Boolean)
  name.vb: BytesOf(String, Encoding, Encoding, Boolean)
