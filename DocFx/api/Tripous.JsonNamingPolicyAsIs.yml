  summary: >-
    A <xref href="System.Text.Json.JsonNamingPolicy" data-throw-if-not-resolved="false"></xref> that leaves property names as they are.


    <p>For example: <code>CustomerName</code> is serialized as <code>CustomerName</code> and <code>Customer_Name</code> is serialized as <code>Customer_Name</code></p>
