  assemblies:
  - Tripous.Data
  namespace: Tripous.Data
  summary: >-
    Represents a lookup list.


    <p>Lookup list items may come from</p>

    <ul><li>a SELECT statement, given in the <xref href="Tripous.Data.LookupDef.SqlText" data-throw-if-not-resolved="false"></xref> property</li><li>a SELECT statement constructed using the <xref href="Tripous.Data.LookupDef.TableName" data-throw-if-not-resolved="false"></xref></li><li>a <xref href="System.Data.DataTable" data-throw-if-not-resolved="false"></xref> passed to <xref href="Tripous.Data.LookupSource.LoadFrom(System.Data.DataTable)" data-throw-if-not-resolved="false"></xref>() method</li><li>an enum type, given in the <xref href="Tripous.Data.LookupDef.EnumTypeName" data-throw-if-not-resolved="false"></xref> property</li><li>a <xref href="Tripous.Data.LookupSource" data-throw-if-not-resolved="false"></xref> derived class, given in the <xref href="Tripous.Data.LookupDef.ClassName" data-throw-if-not-resolved="false"></xref> property</li><li>as a last resort using the <xref href="Tripous.BaseDef.Name" data-throw-if-not-resolved="false"></xref> as a <xref href="Tripous.Data.LookupDef.TableName" data-throw-if-not-resolved="false"></xref></li></ul>
