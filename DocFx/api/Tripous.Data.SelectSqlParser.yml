  assemblies:
  - Tripous.Data
  namespace: Tripous.Data
  summary: >-
    A simple SELECT Sql parser. It parses a SELECT statement into its constituents parts.


    <p>NOTE: This is not a full SQL parser.</p>

    <p>It supports nested SELECT statements inside parentheses because it ignores clause keywords while inside parentheses.</p>

    <p>It also skips string literals, comments, double quoted identifiers, bracketed identifiers, and backtick quoted identifiers.</p>
