  assemblies:
  - Tripous.Logging
  namespace: Tripous.Logging
  summary: >-
    Represents a named source in a log.


    <p>The Source and the Scope of a LogEntry are just names devised by the developer.</p>

    <p>A Source could be the full name of a class, such as a MainForm, an action url or any other suitable string and it marks all the log messages produced by this source.</p>

    <p>A Scope could be the name of a method or the name of a group of methods, or whatever.</p>

    <p>The Logger class provides a method to create a Source.</p>

    <p>The Source creates a Default Scope when it is created. The developer never gets a reference to a Scope.</p>

    <p>The developer may call EnterScope(...) passing it a Scope name.</p>

    <p>The ExitScope() exits the last entered Scope. The Default Scope cannot exited.</p>

    <p>It is even safe to call ExitScope() more times than the existing Scopes.</p>

    <p>Any call to Source log methods, such as Log(), Debug(), Error(), etc. produces a LogEntry marked with the Source name and the name of the latest Scope.</p>
  example: []
