  assemblies:
  - Tripous.Logging
  namespace: Tripous.Logging
  summary: >-
    Begins a new log scope. A log scope is just a label under which next log messages are recorded. Log scopes can be nested.


    <p>The Name of a scope is the label of the scope.</p>

    <p>Scope params are attached to each log message in that scope. </p>
