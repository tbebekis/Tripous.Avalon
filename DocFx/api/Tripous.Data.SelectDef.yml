    path: ../Tripous.Data/Registry/SelectDef.cs
    startLine: 58
  assemblies:
  - Tripous.Data
  namespace: Tripous.Data
  summary: >-
    Creates filter entries in the <xref href="Tripous.Data.SelectDef.FilterDefs" data-throw-if-not-resolved="false"></xref> when no filters exist.


    <p><b>WARNING:</b> The module name and a table name are used in constructing a unique StatementName.</p>

    <p>The StatementName is used with the <xref href="Tripous.Data.SqlStore.GetNativeSchemaFromTableName(System.String%2cSystem.String)" data-throw-if-not-resolved="false"></xref>

    so the <code>ModuleName.TableName</code> must construct a unique name because schema DataTables are stored in the <xref href="Tripous.Data.SqlCache" data-throw-if-not-resolved="false"></xref> under that unique name. </p>
  example: []
  syntax:
    content: public SqlFilterDefs DefineFilters(string ModuleName, SqlStore Store)
    parameters:
    - id: ModuleName
      type: System.String
    - id: Store
      type: Tripous.Data.SqlStore
    return:
      type: Tripous.Data.SqlFilterDefs
    content.vb: Public Function DefineFilters(ModuleName As String, Store As SqlStore) As SqlFilterDefs
